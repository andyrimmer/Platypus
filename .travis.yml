language: python
python: "3.10"
os: linux
dist: focal

addons:
  apt:
    packages:
      - autoconf
      - build-essential
      - libbz2-dev
      - libcurl4-openssl-dev
      - liblzma-dev
      - libncurses5-dev
      - python3-dev
      - zlib1g-dev

before_install:
  - wget https://github.com/samtools/htslib/releases/download/1.23.1/htslib-1.23.1.tar.bz2
  - tar xjf htslib-1.23.1.tar.bz2
  - (cd htslib-1.23.1 && ./configure && make && sudo make install)
  - sudo ldconfig

install:
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

script:
  - make PYTHON=python
